<!-- Translate Button (Header inline) -->
<div class="translate-container">
  <button class="translate-btn" onclick="toggleTranslate()">🌐 Translate / Traduire</button>
  <div id="google_translate_element" style="display:none;"></div>
</div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,fr',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    }, 'google_translate_element');

    // Auto-detect browser language
    const userLang = navigator.language || navigator.userLanguage;
    if(userLang.startsWith('fr')){
      setTimeout(() => {
        const select = document.querySelector('#google_translate_element select');
        if(select) select.value = 'fr';
        select.dispatchEvent(new Event('change'));
      }, 500);
    }
  }

  function toggleTranslate() {
    var elem = document.getElementById('google_translate_element');
    if (elem.style.display === 'none' || elem.style.display === '') {
      elem.style.display = 'inline-block';
    } else {
      elem.style.display = 'none';
    }
  }
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<style>
  /* Make translate widget inline next to button */
  #google_translate_element {
    display: none;
    margin-left: 10px;
    vertical-align: middle;
  }
  .translate-container {
    position: absolute;
    top: 15px;
    right: 20px;
    z-index: 999;
    display: flex;
    align-items: center;
  }
</style>
